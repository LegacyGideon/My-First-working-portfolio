<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 15 500 530" fill="none">
  <defs>
    <radialGradient id="ocean" cx="0" cy="0" r="1" gradientTransform="matrix(185 205 -205 185 260 195)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D9D0"/>
